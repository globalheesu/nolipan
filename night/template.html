<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>밤의 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a museum floor plan on a gallery-wall card, laid on the dark parquet of the night; the log is the evidence. */
:root {
  --night: #23223D;      /* museum at night */
  --night-2: #2E2D4F;
  --wall: #ECEBF2;       /* gallery wall card */
  --wall-2: #DCDAE8;
  --ink: #1E1C33;
  --ink-soft: #5D5A78;
  --red: #CF3838;        /* the theft, the stamp */
  --hl: #F2C33D;         /* tampered record */
  --p0: #2563D9; --p1: #E8761A; --p2: #7C4DDB; --p3: #0E8F84; --p4: #D53F7C; --p5: #8A5A2B;
  --display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--night);
  background-image: linear-gradient(45deg, var(--night-2) 25%, transparent 25%, transparent 75%, var(--night-2) 75%), linear-gradient(45deg, var(--night-2) 25%, transparent 25%, transparent 75%, var(--night-2) 75%);
  background-size: 36px 36px; background-position: 0 0, 18px 18px;
  color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
#app { min-height: 100%; display: grid; place-items: start center; padding: 16px; }
.card { background: var(--wall); border-radius: 8px; padding: 20px; width: min(560px, 100%); box-shadow: 0 18px 40px rgba(0,0,0,.4); }
.card + .card { margin-top: 12px; }
.logo { font-family: var(--display); font-size: clamp(54px, 15vw, 84px); line-height: 1; letter-spacing: -0.02em; margin: 4px 0 8px; position: relative; display: inline-block; }
.logo::after { content: ''; position: absolute; left: -4%; right: -4%; top: 52%; height: .16em; background: var(--hl); mix-blend-mode: multiply; transform: rotate(-2deg); }
.tagline { font-size: 16px; margin: 0 0 18px; max-width: 38ch; }
.field { display: grid; gap: 8px; margin-bottom: 14px; }
.lab { font-weight: 700; font-size: 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .chip { border: 2px solid var(--ink); background: transparent; border-radius: 999px; padding: 6px 14px; min-height: 40px; }
.seg button[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--ink); color: var(--wall); }
.chip[disabled] { opacity: .35; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; min-height: 46px; }
.btn-primary { background: var(--ink); color: var(--wall); box-shadow: 0 3px 0 #000; }
.btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
.btn-red { background: var(--red); color: #fff; box-shadow: 0 3px 0 #7d1d1d; }
.btn-ghost { background: transparent; border: 2px solid var(--ink); }
.btn[disabled] { opacity: .4; }
.fine { font-size: 13px; color: var(--ink-soft); }
.names { display: grid; gap: 6px; }
.namefield { display: flex; gap: 8px; align-items: center; }
.namefield input { font: inherit; border: 2px solid var(--ink); border-radius: 8px; padding: 8px 10px; min-height: 42px; width: 100%; max-width: 220px; background: #fff; color: var(--ink); }
.sw { width: 24px; height: 24px; border-radius: 7px; display: inline-grid; place-items: center; color: #fff; font-size: 12px; flex: none; }
.sw.big { width: 48px; height: 48px; border-radius: 12px; font-size: 22px; }
.top { display: flex; align-items: center; gap: 10px; color: var(--wall); width: min(560px, 100%); margin-bottom: 10px; }
.top h1 { font-size: 24px; color: var(--wall); }
.top .meta { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.iconbtn { background: rgba(236,235,242,.1); border: 1px solid rgba(236,235,242,.35); color: var(--wall); border-radius: 8px; min-height: 40px; padding: 0 10px; }
.plan { width: 100%; aspect-ratio: 1; display: block; touch-action: manipulation; user-select: none; }
.plan *:not(.room) { pointer-events: none; }
.plan .room { fill: #fff; stroke: var(--ink); stroke-width: 2; }
.plan .room.vault { fill: #F6E3E3; }
.plan .room.pick { fill: #E4ECFB; cursor: pointer; }
.plan .room.pick:hover { fill: #D3E0FA; }
.plan .room.bad { stroke: var(--red); stroke-width: 5; }
.plan .rname { font: 700 13px var(--body); fill: var(--ink-soft); }
.plan .cnt { font: 400 34px var(--display); fill: var(--ink); text-anchor: end; }
.plan .cnt.bad { fill: var(--red); }
.plan .door { stroke: #fff; stroke-width: 10; stroke-linecap: butt; }
.plan .sensor { fill: var(--hl); stroke: var(--ink); stroke-width: 1.5; }
.plan .stxt { font: 700 11px var(--body); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.plan .tok text { font: 700 11px var(--body); fill: #fff; text-anchor: middle; dominant-baseline: central; }
.plan .path { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.plan .hr { font: 700 11px var(--body); fill: #fff; text-anchor: middle; dominant-baseline: central; }
.hours { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.hours button { border: 2px solid var(--ink); background: transparent; border-radius: 8px; min-height: 52px; padding: 4px; display: grid; line-height: 1.2; font-variant-numeric: tabular-nums; }
.hours button small { font-size: 11px; color: var(--ink-soft); }
.hours button[aria-pressed="true"] { background: var(--ink); color: var(--wall); }
.hours button[aria-pressed="true"] small { color: var(--wall-2); }
.role { border-radius: 8px; padding: 14px; color: #fff; display: grid; gap: 4px; margin-bottom: 12px; }
.role.cul { background: var(--red); }
.role.inn { background: var(--ink); }
.role b { font-family: var(--display); font-weight: 400; font-size: 24px; }
.claims { display: grid; gap: 6px; font-size: 14px; }
.claims div { display: grid; grid-template-columns: 24px auto 1fr; gap: 8px; align-items: center; }
.claims .r { font-variant-numeric: tabular-nums; color: var(--ink-soft); overflow-wrap: anywhere; }
.timer { font: 400 30px var(--display); font-variant-numeric: tabular-nums; }
.stamp { display: inline-block; border: 4px solid var(--red); color: var(--red); font-family: var(--display); font-size: 34px; padding: 2px 14px; transform: rotate(-5deg); border-radius: 6px; animation: stamp .35s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes stamp { from { transform: rotate(-5deg) scale(1.8); opacity: 0; } }
table.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; margin: 8px 0 12px; }
table.score th, table.score td { padding: 6px 4px; border-bottom: 1px solid rgba(30,28,51,.15); text-align: right; }
table.score th:first-child, table.score td:first-child { text-align: left; }
.cover { position: fixed; inset: 0; background: var(--night); display: grid; place-items: center; z-index: 30; padding: 16px; }
.cover .card { text-align: center; display: grid; justify-items: center; gap: 10px; }
.note { background: #FFF6D6; border-left: 4px solid var(--hl); padding: 8px 10px; border-radius: 4px; font-size: 14px; }
.modal-bg { position: fixed; inset: 0; background: rgba(10,10,25,.6); display: grid; place-items: center; padding: 16px; z-index: 40; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
/*ENGINE*/
</script>
<script>
/*APP*/
</script>
</body>
</html>
