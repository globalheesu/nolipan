<!DOCTYPE html>

<meta property="og:title" content="밤의 기록 · 놀이판">

<style>
/* Layout idea: a museum floor plan on a gallery-wall card, laid on the dark parquet of the night; the log is the evidence. */
:root {
  --night: #23223D;      /* museum at night */
  --night-2: #2E2D4F;
  --wall: #ECEBF2;       /* gallery wall card */
  --wall-2: #DCDAE8;
  --ink: #1E1C33;
  --ink-soft: #5D5A78;
  --red: #CF3838;        /* the theft, the stamp */
  --hl: #F2C33D;         /* tampered record */
  --p0: #2563D9; --p1: #E8761A; --p2: #7C4DDB; --p3: #0E8F84; --p4: #D53F7C; --p5: #8A5A2B;
  --display: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --body: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--night);
  background-image: linear-gradient(45deg, var(--night-2) 25%, transparent 25%, transparent 75%, var(--night-2) 75%), linear-gradient(45deg, var(--night-2) 25%, transparent 25%, transparent 75%, var(--night-2) 75%);
  background-size: 36px 36px; background-position: 0 0, 18px 18px;
  color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; text-wrap: balance; letter-spacing: -0.025em; }
#app { min-height: 100%; display: grid; place-items: start center; padding: 16px; }
.card { background: var(--wall); border-radius: 8px; padding: 20px; width: min(560px, 100%); box-shadow: 0 18px 40px rgba(0,0,0,.4); }
.card + .card { margin-top: 12px; }
.logo { display: table; font-family: var(--display); font-weight: 900; font-size: clamp(52px, 14vw, 80px); line-height: 1; letter-spacing: -0.05em; margin: 4px 0 8px; position: relative; }
.logo::after { content: ''; position: absolute; left: -4%; right: -4%; top: 52%; height: .16em; background: var(--hl); mix-blend-mode: multiply; transform: rotate(-2deg); }
.tagline { font-size: 16px; margin: 0 0 18px; max-width: 38ch; }
.field { display: grid; gap: 8px; margin-bottom: 14px; }
.lab { font-weight: 700; font-size: 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .chip { border: 2px solid var(--ink); background: transparent; border-radius: 999px; padding: 6px 14px; min-height: 40px; }
.seg button[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--ink); color: var(--wall); }
.chip[disabled] { opacity: .35; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; min-height: 46px; }
.btn-primary { background: var(--ink); color: var(--wall); box-shadow: 0 3px 0 #000; }
.btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
.btn-red { background: var(--red); color: #fff; box-shadow: 0 3px 0 #7d1d1d; }
.btn-ghost { background: transparent; border: 2px solid var(--ink); }
.btn[disabled] { opacity: .4; }
.fine { font-size: 13px; color: var(--ink-soft); }
.names { display: grid; gap: 6px; }
.namefield { display: flex; gap: 8px; align-items: center; }
.namefield input { font: inherit; font-size: 16px; border: 2px solid var(--ink); border-radius: 8px; padding: 8px 10px; min-height: 42px; width: 100%; max-width: 220px; background: #fff; color: var(--ink); }
.sw { width: 24px; height: 24px; border-radius: 7px; display: inline-grid; place-items: center; color: #fff; font-size: 12px; flex: none; }
.sw.big { width: 48px; height: 48px; border-radius: 12px; font-size: 22px; }
.top { display: flex; align-items: center; gap: 10px; color: var(--wall); width: min(560px, 100%); margin-bottom: 10px; }
.top h1 { font-size: 20px; color: var(--wall); }
.top .iconbtn { padding: 0 9px; font-size: 13px; }
.top .meta { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.iconbtn { background: rgba(236,235,242,.1); border: 1px solid rgba(236,235,242,.35); color: var(--wall); border-radius: 8px; min-height: 40px; padding: 0 10px; }
.plan { width: 100%; aspect-ratio: 1; display: block; touch-action: manipulation; user-select: none; }
.plan *:not(.room) { pointer-events: none; }
.plan .room { fill: #fff; stroke: var(--ink); stroke-width: 2; }
.plan .room.vault { fill: #F6E3E3; }
.plan .room.pick { fill: #E4ECFB; cursor: pointer; }
.plan .room.pick:hover { fill: #D3E0FA; }
.plan .room.bad { stroke: var(--red); stroke-width: 5; }
.plan .rname { font: 700 13px var(--body); fill: var(--ink-soft); }
.plan .cnt { font: 900 32px var(--display); fill: var(--ink); text-anchor: end; }
.plan .cnt.bad { fill: var(--red); }
.plan .door { stroke: #fff; stroke-width: 10; stroke-linecap: butt; }
.plan .sensor { fill: var(--hl); stroke: var(--ink); stroke-width: 1.5; }
.plan .stxt { font: 700 11px var(--body); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.plan .tok text { font: 700 11px var(--body); fill: #fff; text-anchor: middle; dominant-baseline: central; }
.plan .path { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.plan .hr { font: 700 11px var(--body); fill: #fff; text-anchor: middle; dominant-baseline: central; }
.hours { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.hours button { border: 2px solid var(--ink); background: transparent; border-radius: 8px; min-height: 52px; padding: 4px; display: grid; line-height: 1.2; font-variant-numeric: tabular-nums; }
.hours button small { font-size: 11px; color: var(--ink-soft); }
.hours button[aria-pressed="true"] { background: var(--ink); color: var(--wall); }
.hours button[aria-pressed="true"] small { color: var(--wall-2); }
.role { border-radius: 8px; padding: 14px; color: #fff; display: grid; gap: 4px; margin-bottom: 12px; }
.role.cul { background: var(--red); }
.role.inn { background: var(--ink); }
.role b { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
.claims { display: grid; gap: 6px; font-size: 14px; }
.claims div { display: grid; grid-template-columns: 24px auto 1fr; gap: 8px; align-items: center; }
.claims .r { font-variant-numeric: tabular-nums; color: var(--ink-soft); overflow-wrap: anywhere; }
.timer { font: 800 30px var(--display); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--red); }
.stamp { display: inline-block; border: 4px solid var(--red); color: var(--red); font-family: var(--display); font-weight: 900; letter-spacing: .05em; font-size: 34px; padding: 2px 14px; transform: rotate(-5deg); border-radius: 6px; animation: stamp .35s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes stamp { from { transform: rotate(-5deg) scale(1.8); opacity: 0; } }
table.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; margin: 8px 0 12px; }
table.score th, table.score td { padding: 6px 4px; border-bottom: 1px solid rgba(30,28,51,.15); text-align: right; }
table.score th:first-child, table.score td:first-child { text-align: left; }
.cover { position: fixed; inset: 0; background: var(--night); display: grid; place-items: center; z-index: 30; padding: 16px; }
.cover .card { text-align: center; display: grid; justify-items: center; gap: 10px; }
.note { background: #FFF6D6; border-left: 4px solid var(--hl); padding: 8px 10px; border-radius: 4px; font-size: 14px; }
.modal-bg { position: fixed; inset: 0; background: rgba(10,10,25,.6); display: grid; place-items: center; padding: 16px; z-index: 40; }

#app { padding: 20px 16px 40px; }
.col { width: min(560px, 100%); display: grid; gap: 12px; }
.card { border-radius: 16px; padding: 22px 20px; }
.card + .card { margin-top: 0; }
.card h3 { font-size: 17px; margin-bottom: 10px; }
.hero { padding-top: 18px; }
.logo.small { font-size: 40px; margin-bottom: 4px; }
.kicker { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.big { font-size: 24px; line-height: 1.3; margin: 0 0 14px; }
.lead { margin: 0 0 16px; color: var(--ink-soft); }
.meta-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: -6px 0 20px; }
.meta-chips span { font-size: 13px; font-weight: 600; color: var(--ink-soft); background: rgba(30,28,51,.06); border-radius: 999px; padding: 4px 10px; }
.seg-wide { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.screen-title { font-size: 22px; margin: 4px 0 18px; }
.block { display: grid; gap: 6px; justify-items: start; margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid rgba(30,28,51,.12); }
.block .fine { margin: 0; }
.field label, .field .lab { font-weight: 700; font-size: 14px; }
#nick, #code { font: inherit; font-size: 16px; border: 2px solid var(--ink); border-radius: 10px; padding: 9px 12px; min-height: 46px; background: #fff; color: var(--ink); width: 100%; max-width: 260px; }
#code { max-width: 130px; letter-spacing: .25em; font-weight: 800; font-variant-numeric: tabular-nums; }
.formmsg { color: var(--red); font-size: 14px; margin: 0 0 8px; }
.formmsg:empty { display: none; }
.btn { border-radius: 12px; }
.btn-primary { box-shadow: none; }
.btn-primary:active, .btn-red:active { transform: scale(.98); }
.btn-red { box-shadow: none; }
.btn-text { background: transparent; border: 0; color: var(--ink-soft); padding: 8px 4px; min-height: 40px; font-weight: 600; }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.toggle input { width: 22px; height: 22px; accent-color: var(--ink); }
.tag { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: rgba(30,28,51,.08); color: var(--ink-soft); vertical-align: 1px; }
.tag.warn { background: #FFE9D6; color: #A45512; }
.waitline { color: var(--ink-soft); margin: 0 0 8px; }
.roomcode { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.roomcode span { font-weight: 700; color: var(--ink-soft); }
.roomcode b { font-family: var(--display); font-weight: 900; font-size: 56px; letter-spacing: .06em; line-height: 1; font-variant-numeric: tabular-nums; }
.players { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 24px 1fr auto auto; gap: 10px; align-items: center; font-size: 15px; }
.prow .sub { color: var(--ink-soft); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--wall); padding: 10px 16px; border-radius: 10px; z-index: 60; font-size: 14px; }
.who { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 700; }
.role { border-radius: 12px; }
.steps { list-style: none; display: flex; gap: 6px; padding: 0; margin: 0 0 12px; counter-reset: st; }
.steps li { counter-increment: st; font-size: 12px; font-weight: 700; color: var(--ink-soft); background: rgba(30,28,51,.06); border-radius: 999px; padding: 3px 10px; }
.steps li::before { content: counter(st) ' '; }
.steps li[aria-current="step"] { background: var(--ink); color: var(--wall); }
.steps li.done { color: var(--ink); }
.instr { margin: 0 0 10px; font-size: 16px; }
.actions { margin-top: 14px; }
.opts { display: grid; gap: 8px; margin: 6px 0 12px; }
.opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 2px solid var(--ink); background: #fff; border-radius: 12px; padding: 12px 14px; min-height: 52px; text-align: left; }
.opt[aria-pressed="true"] { background: #FFF3CC; border-color: #B88A00; }
.opt[disabled] { opacity: .4; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-soft); margin: 0 0 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { font-style: normal; }
.lg-num { font-weight: 900; font-size: 16px; color: var(--ink); }
.lg-sensor { background: var(--hl); border: 1.5px solid var(--ink); border-radius: 4px; padding: 0 4px; font-size: 10px; font-weight: 700; color: var(--ink); }
.lg-tok { width: 14px; height: 14px; border-radius: 50%; background: var(--p0); display: inline-block; border: 1.5px solid #fff; box-shadow: 0 0 0 1px var(--ink-soft); }
.hours button.warn small { color: var(--red); font-weight: 700; }
.hours button.warn[aria-pressed="true"] small { color: #FFB3B3; }
.note.warn { background: #FDECEC; border-left-color: var(--red); margin-top: 10px; }
.result { margin: 0; padding: 12px 14px; border-radius: 10px; font-size: 15px; }
.result.ok { background: #E7F5EC; }
.result.warn { background: #FDECEC; }
.stampwrap { margin: 2px 0 14px; }
.stamp.miss { border-color: var(--ink); color: var(--ink); }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 12px 0; font-size: 14px; }
dl.facts dt { color: var(--ink-soft); font-weight: 600; }
dl.facts dd { margin: 0; overflow-wrap: anywhere; }
.rank { list-style: none; padding: 0; margin: 8px 0 18px; display: grid; gap: 8px; }
.rank li { display: grid; grid-template-columns: 22px 24px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: #fff; }
.rank li.win { background: #FFF3CC; }
.rank .n { font-weight: 900; color: var(--ink-soft); }
.rank .pt { font-weight: 800; font-variant-numeric: tabular-nums; }
.rules { padding-left: 20px; margin: 0 0 14px; display: grid; gap: 6px; }
.cover h2 { font-size: 24px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
</style>
