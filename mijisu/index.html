<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:title" content="미지수 · 놀이판">
<meta property="og:description" content="남의 숫자는 다 보이는데 내 숫자만 몰라요. 먼저 풀어내고 외치세요.">

<style>
/* 미지수 — a slate card table. Everyone's card faces out; yours is the one blank. */
:root { --table: #25303B; --table-2: #2D3A47; --accent: #E8B43A; --red: #C8423C; }
body.on-table { background: var(--table) radial-gradient(120% 60% at 50% 0%, var(--table-2), var(--table) 70%); }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 14px; margin: 0 2px 14px; }
.board .sc { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
.board .sc .nm { width: 3.6em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--table-mute); font-weight: 600; }
.board .sc.mine .nm { color: var(--table-ink); }
.board .sc b { font-weight: 800; min-width: 1em; text-align: right; }
.board .pips { flex: 1; display: flex; gap: 3px; } .board .pips i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); } .board .pips i.on { background: var(--accent); }
.others { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; margin-bottom: 12px; }
.seat { position: relative; display: grid; justify-items: center; gap: 8px; padding: 12px 4px 10px; border-radius: var(--r-md); background: rgba(255,255,255,.04); }
.seat.turn { background: rgba(232,180,58,.1); box-shadow: inset 0 0 0 1.5px rgba(232,180,58,.6); }
.card { width: 62px; height: 86px; border-radius: 10px; background: #FBFAF6; color: var(--ink); display: grid; place-items: center; position: relative; box-shadow: 0 1px 0 rgba(0,0,0,.15), 0 8px 16px rgba(0,0,0,.22); font-weight: 800; transition: transform .35s var(--ease); }
.card .r { font-size: 30px; letter-spacing: -0.05em; line-height: 1; }
.card .s { position: absolute; top: 6px; left: 7px; font-size: 12px; line-height: 1; } .card .s2 { position: absolute; bottom: 6px; right: 7px; font-size: 12px; line-height: 1; transform: rotate(180deg); }
.card.red { color: var(--red); }
.card.new { animation: deal .45s var(--ease); }
@keyframes deal { from { transform: translateY(-20px); opacity: 0; } }
.seat .nm { font-size: 13px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--table-mute); }
.seat.turn .nm { color: var(--table-ink); }
.finger { position: absolute; top: 6px; right: 6px; min-width: 26px; height: 26px; border-radius: 999px; background: var(--accent); color: var(--ink); font-weight: 800; font-size: 14px; display: grid; place-items: center; padding: 0 7px; animation: popin .3s var(--ease); }
.finger.wait { background: rgba(255,255,255,.14); color: var(--table-ink); animation: none; }
@keyframes popin { from { transform: scale(.4); opacity: 0; } }
.me { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; background: rgba(255,255,255,.05); border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 10px; box-shadow: inset 0 0 0 1px var(--table-line); }
.me.turn { box-shadow: inset 0 0 0 1.5px rgba(232,180,58,.6); }
.me .card { background: #34465A; color: var(--table-ink); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18); }
.me .card .r { font-size: 34px; }
.me h2 { margin: 0; font-size: 16px; font-weight: 700; }
.me p { margin: 2px 0 0; font-size: 13px; color: var(--table-mute); }
.stage { background: var(--surface); color: var(--ink); border-radius: var(--r-lg); padding: 18px 16px 16px; margin-bottom: 10px; min-height: 120px; }
.stage h3 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.03em; }
.stage .sub { margin: 4px 0 14px; color: var(--ink-2); font-size: 14px; }
.qs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.q { border: 0; border-radius: 14px; background: var(--fill); padding: 12px 6px; text-align: center; display: grid; gap: 4px; color: var(--ink); transition: background .15s, transform .08s; }
.q:not(:disabled):active { transform: scale(.97); background: var(--fill-2); }
.q b { font-size: 17px; font-weight: 800; letter-spacing: -0.03em; }
.q small { font-size: 11px; color: var(--ink-3); }
.q:disabled { cursor: default; }
.q.big { padding: 16px; background: var(--ink); color: #fff; } .q.big small { color: rgba(255,255,255,.6); }
.q.big b { font-size: 24px; }
.pad { display: grid; grid-template-columns: repeat(auto-fit, minmax(52px, 1fr)); gap: 8px; margin-top: 12px; }
.pad button { height: 56px; border-radius: 14px; border: 0; background: var(--fill); font-size: 22px; font-weight: 800; color: var(--ink); }
.pad button.sel { background: var(--ink); color: #fff; }
.pad button.bad { animation: shake .3s; box-shadow: inset 0 0 0 2px var(--danger); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.timer { height: 3px; border-radius: 2px; background: var(--fill); overflow: hidden; margin-top: 14px; }
.timer i { display: block; height: 100%; background: var(--ink); transform-origin: left; }
.call { width: 100%; height: 60px; border-radius: 16px; border: 0; background: var(--accent); color: var(--ink); font-size: 18px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 12px; transition: transform .08s; }
.call:active { transform: scale(.985); }
.ranks { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.ranks button { height: 48px; border-radius: 10px; border: 0; background: var(--fill); font-weight: 800; font-size: 18px; color: var(--ink); }
.ranks button.x { color: var(--ink-3); text-decoration: line-through; background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.notes { background: rgba(255,255,255,.05); border-radius: var(--r-md); padding: 14px; margin-bottom: 12px; box-shadow: inset 0 0 0 1px var(--table-line); }
.notes h4 { margin: 0 0 10px; font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.notes h4 span { font-weight: 500; color: var(--table-mute); font-size: 12px; }
.notes .ranks button { height: 40px; font-size: 15px; background: rgba(255,255,255,.9); }
.notes .ranks button.x { background: transparent; color: var(--table-mute); box-shadow: inset 0 0 0 1px var(--table-line); }
.log { display: grid; gap: 6px; margin-top: 12px; }
.log .e { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; color: var(--table-mute); }
.log .e b { background: rgba(255,255,255,.9); color: var(--ink); border-radius: 6px; padding: 1px 8px; font-weight: 700; }
.log .e i { font-style: normal; background: rgba(255,255,255,.1); color: var(--table-ink); border-radius: 999px; padding: 1px 8px; }
.empty { font-size: 13px; color: var(--table-mute); margin: 6px 0 0; }
.flash { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; pointer-events: none; }
.flash div { background: var(--surface); color: var(--ink); border-radius: 22px; padding: 18px 26px; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; box-shadow: 0 20px 50px rgba(0,0,0,.35); text-align: center; animation: popin .3s var(--ease); }
.flash div small { display: block; font-size: 14px; font-weight: 600; color: var(--ink-2); margin-top: 4px; letter-spacing: 0; }
.modal .ranks button { height: 52px; }
</style>
