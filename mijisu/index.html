<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미지수 · 놀이판</title>
<meta name="description" content="남의 숫자는 다 보이는데 내 숫자만 모르는 게임. 친구들의 답으로 내 숫자를 풀어내고 먼저 외치세요.">
<meta property="og:title" content="미지수 · 놀이판">
<meta property="og:description" content="남의 숫자는 다 보이는데 내 숫자만 몰라요. 먼저 풀어내고 외치세요.">

<style>
/* Layout idea: a card table at night — green felt, cream cards held up to foreheads, the only unknown is your own. */
:root {
  --felt: #1E4D3B; --felt-2: #24594A; --cream: #FFFBF2; --ink: #1B1A17; --ink-2: #57534A; --red: #D23B3B; --gold: #F2B632; --line: rgba(27,26,23,.12);
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; overflow-x: hidden; overflow-x: clip; }
body { background: var(--felt) radial-gradient(120% 80% at 50% 0%, var(--felt-2), var(--felt)); color: var(--cream); font-family: var(--font); font-size: 16px; line-height: 1.5; word-break: keep-all; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }

/* menu sheet */
.sheet { background: var(--cream); color: var(--ink); border-radius: 22px; padding: 22px 20px 24px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.logo { display: flex; align-items: center; gap: 12px; margin: 4px 0 6px; }
.logo h1 { margin: 0; font-size: 44px; font-weight: 900; letter-spacing: -0.05em; line-height: 1; }
.logo .mini { width: 46px; height: 62px; border-radius: 8px; background: var(--cream); border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 800; font-size: 28px; font-style: italic; font-family: Georgia, "Times New Roman", serif; transform: rotate(-6deg); box-shadow: 3px 3px 0 var(--ink); }
.tag { margin: 0 0 14px; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chips span { background: #EFE8D6; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
.rules { margin: 0 0 18px; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: r; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 15px; }
.rules li::before { counter-increment: r; content: counter(r); width: 26px; height: 26px; border-radius: 8px; background: var(--ink); color: var(--cream); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.rules b { display: block; }
.rules span { color: var(--ink-2); }
.field { margin-bottom: 12px; }
.field label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
input[type=text] { width: 100%; min-width: 0; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--ink); }
.row { display: flex; gap: 8px; }
.row > * { flex: 1 1 0; min-width: 0; }
.btn { min-height: 50px; border-radius: 14px; border: 2px solid var(--ink); background: #fff; color: var(--ink); font-weight: 800; padding: 0 16px; }
.btn-primary { background: var(--ink); color: var(--cream); }
.btn-gold { background: var(--gold); border-color: var(--ink); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-text { background: none; border: 0; color: var(--ink-2); font-weight: 700; padding: 10px 0; }
.msg { color: var(--red); font-size: 14px; min-height: 20px; margin: 4px 0 0; }
.fine { color: var(--ink-2); font-size: 13px; margin: 8px 0 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.roomcode { display: flex; align-items: baseline; gap: 10px; }
.roomcode b { font-size: 48px; font-weight: 900; letter-spacing: .06em; }
.players { display: grid; gap: 8px; margin: 10px 0 16px; }
.players .p { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.pill { font-size: 11px; background: #EFE8D6; border-radius: 999px; padding: 2px 8px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1 1 0; min-width: 0; min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--ink); font-weight: 800; }
.seg button.on { border-color: var(--ink); background: var(--ink); color: var(--cream); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--ink); background: #fff; font-weight: 900; }

/* table */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; white-space: nowrap; }
.top .brand { margin: 0; color: var(--cream); }
.top .meta { font-size: 13px; opacity: .8; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { background: rgba(255,255,255,.12); border: 0; border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 700; }
.board { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -2px 0 12px; font-size: 13px; }
.board .goal { font-weight: 800; color: var(--gold); margin-right: 4px; }
.board .sc { background: rgba(255,255,255,.12); border-radius: 999px; padding: 3px 10px; }
.board .sc b { font-weight: 900; }
.board .sc.mine { background: var(--gold); color: var(--ink); }
.others { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; margin-bottom: 14px; }
.seat { position: relative; display: grid; justify-items: center; gap: 6px; padding: 8px 4px 10px; border-radius: 16px; }
.seat.turn { background: rgba(242,182,50,.16); box-shadow: inset 0 0 0 2px var(--gold); }
.card { width: 64px; height: 88px; border-radius: 10px; background: var(--cream); color: var(--ink); display: grid; place-items: center; position: relative; box-shadow: 0 6px 14px rgba(0,0,0,.25); font-weight: 900; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.card .r { font-size: 30px; letter-spacing: -0.04em; line-height: 1; }
.card .s { position: absolute; top: 6px; left: 7px; font-size: 14px; line-height: 1; }
.card .s2 { position: absolute; bottom: 6px; right: 7px; font-size: 14px; line-height: 1; transform: rotate(180deg); }
.card.red { color: var(--red); }
.card.new { animation: deal .45s cubic-bezier(.2,.8,.2,1); }
@keyframes deal { from { transform: translateY(-24px) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
.seat .nm { font-size: 13px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .pts { font-size: 12px; opacity: .85; }
.finger { position: absolute; top: -6px; right: 6px; min-width: 30px; height: 30px; border-radius: 999px; background: var(--gold); color: var(--ink); font-weight: 900; display: grid; place-items: center; padding: 0 8px; box-shadow: 0 3px 0 rgba(0,0,0,.25); animation: popin .3s cubic-bezier(.2,1.6,.4,1); }
.finger.wait { background: rgba(255,255,255,.2); color: var(--cream); animation: none; }
@keyframes popin { from { transform: scale(.3); } to { transform: scale(1); } }

.me { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; background: rgba(0,0,0,.18); border-radius: 18px; padding: 12px; margin-bottom: 12px; }
.me .card { background: repeating-linear-gradient(45deg, #2F6B57 0 6px, #2A6150 6px 12px); color: var(--cream); border: 3px solid var(--cream); }
.me .card .r { font-size: 36px; }
.me h2 { margin: 0; font-size: 17px; }
.me p { margin: 2px 0 0; font-size: 13px; opacity: .85; }

.stage { background: var(--cream); color: var(--ink); border-radius: 18px; padding: 14px; margin-bottom: 12px; min-height: 120px; }
.stage h3 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.02em; }
.stage .sub { margin: 0 0 12px; color: var(--ink-2); font-size: 14px; }
.qs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.q { border: 2px solid var(--ink); border-radius: 14px; background: #fff; padding: 10px 6px; text-align: center; display: grid; gap: 4px; }
.q b { font-size: 17px; letter-spacing: -0.03em; }
.q small { font-size: 11px; color: var(--ink-2); letter-spacing: -0.01em; }
.q:disabled { cursor: default; }
.q.big { padding: 14px; border-width: 3px; }
.q.big b { font-size: 24px; }
.pad { display: grid; grid-template-columns: repeat(auto-fit, minmax(52px, 1fr)); gap: 8px; margin-top: 10px; }
.pad button { height: 56px; border-radius: 14px; border: 2px solid var(--ink); background: #fff; font-size: 24px; font-weight: 900; }
.pad button.sel { background: var(--ink); color: var(--cream); }
.pad button.bad { animation: shake .3s; border-color: var(--red); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.timer { height: 4px; border-radius: 4px; background: #EFE8D6; overflow: hidden; margin-top: 12px; }
.timer i { display: block; height: 100%; background: var(--ink); transform-origin: left; }

.call { width: 100%; min-height: 64px; border-radius: 18px; border: 3px solid var(--ink); background: var(--gold); color: var(--ink); font-size: 22px; font-weight: 900; letter-spacing: -0.02em; box-shadow: 0 5px 0 var(--ink); margin-bottom: 14px; }
.call:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.ranks { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.ranks button { height: 48px; border-radius: 10px; border: 2px solid var(--ink); background: #fff; font-weight: 900; font-size: 18px; color: var(--ink); }
.ranks button.x { background: #E5DFD0; color: #A39C8C; text-decoration: line-through; border-color: #CFC7B4; }

.notes { background: rgba(0,0,0,.18); border-radius: 18px; padding: 12px; margin-bottom: 12px; }
.notes h4 { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.notes h4 span { font-weight: 500; opacity: .75; font-size: 12px; }
.notes .ranks button { height: 40px; font-size: 15px; }
.log { display: grid; gap: 6px; margin-top: 10px; }
.log .e { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
.log .e b { background: var(--cream); color: var(--ink); border-radius: 8px; padding: 2px 8px; }
.log .e i { font-style: normal; background: rgba(255,255,255,.14); border-radius: 999px; padding: 1px 8px; }
.empty { font-size: 13px; opacity: .7; margin: 6px 0 0; }

.tip { background: rgba(242,182,50,.16); border: 1px solid rgba(242,182,50,.55); border-radius: 14px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
.tip b { color: var(--gold); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink-2); margin: 4px 0 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ink); flex: none; }
.check b { color: var(--ink); }
.modal { position: fixed; inset: 0; background: rgba(10,20,15,.6); display: grid; place-items: end center; z-index: 20; padding: 16px; overflow-y: auto; }
.modal .sheet { width: 100%; max-width: 520px; }
.toast { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); background: var(--ink); color: var(--cream); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 40; box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: calc(100% - 32px); text-align: center; animation: drop .3s ease; }
@keyframes drop { from { transform: translate(-50%, -12px); opacity: 0; } }
.flash { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; pointer-events: none; }
.flash div { background: var(--cream); color: var(--ink); border-radius: 22px; padding: 18px 26px; font-size: 22px; font-weight: 900; box-shadow: 0 20px 50px rgba(0,0,0,.35); text-align: center; animation: popin .35s cubic-bezier(.2,1.6,.4,1); }
.flash div small { display: block; font-size: 14px; font-weight: 600; color: var(--ink-2); margin-top: 4px; }
.winner { text-align: center; padding: 10px 0; }
.winner b { font-size: 30px; display: block; letter-spacing: -0.03em; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
