<style>
/* A night market: indigo dusk, lantern-yellow price tag, cream goods cards. The price tag is the hero. */
:root {
  --night: #1B1F3B; --night-2: #262B52; --cream: #FFF8EC; --ink: #1A1A22; --ink-2: #5A5A66; --lamp: #FFC53D; --red: #E5484D; --line: rgba(26,26,34,.12);
  --c0: #E4572E; --c1: #3B82F6; --c2: #16A34A; --c3: #A855F7;
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; overflow-x: hidden; overflow-x: clip; }
body { background: var(--night) radial-gradient(120% 70% at 50% 0%, var(--night-2), var(--night)); color: var(--cream); font-family: var(--font); font-size: 16px; line-height: 1.5; word-break: keep-all; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
.sheet { background: var(--cream); color: var(--ink); border-radius: 22px; padding: 22px 20px 24px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.logo { display: flex; align-items: center; gap: 12px; margin: 4px 0 6px; }
.logo h1 { margin: 0; font-size: 40px; font-weight: 900; letter-spacing: -0.05em; line-height: 1.05; }
.tagmark { flex: none; width: 50px; height: 50px; border-radius: 12px 12px 12px 4px; background: var(--lamp); color: var(--ink); display: grid; place-items: center; font-weight: 900; font-size: 22px; transform: rotate(-8deg); box-shadow: 3px 3px 0 var(--ink); border: 2px solid var(--ink); }
.tag { margin: 0 0 14px; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chips span { background: #F1E8D6; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
.rules { margin: 0 0 18px; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: r; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 15px; }
.rules li::before { counter-increment: r; content: counter(r); width: 26px; height: 26px; border-radius: 8px; background: var(--ink); color: var(--cream); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.rules b { display: block; } .rules span { color: var(--ink-2); }
.field { margin-bottom: 12px; }
.field label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
input[type=text] { width: 100%; min-width: 0; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--ink); }
.row { display: flex; gap: 8px; } .row > * { flex: 1 1 0; min-width: 0; }
.btn { min-height: 50px; border-radius: 14px; border: 2px solid var(--ink); background: #fff; color: var(--ink); font-weight: 800; padding: 0 16px; }
.btn-primary { background: var(--ink); color: var(--cream); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-text { background: none; border: 0; color: var(--ink-2); font-weight: 700; padding: 10px 0; }
.msg { color: var(--red); font-size: 14px; min-height: 20px; margin: 4px 0 0; }
.fine { color: var(--ink-2); font-size: 13px; margin: 8px 0 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1 1 0; min-width: 0; min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--ink); font-weight: 800; }
.seg button.on { border-color: var(--ink); background: var(--ink); color: var(--cream); }
.roomcode { display: flex; align-items: baseline; gap: 10px; } .roomcode b { font-size: 48px; font-weight: 900; letter-spacing: .06em; }
.players { display: grid; gap: 8px; margin: 10px 0 16px; } .players .p { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.pill { font-size: 11px; background: #F1E8D6; border-radius: 999px; padding: 2px 8px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--ink); background: #fff; font-weight: 900; }

/* table */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; white-space: nowrap; }
.top .brand { margin: 0; color: var(--cream); }
.top .meta { font-size: 13px; opacity: .8; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { background: rgba(255,255,255,.12); border: 0; border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 700; }
.round { font-size: 13px; color: var(--lamp); font-weight: 800; margin: -2px 0 10px; }
.stall { background: var(--cream); color: var(--ink); border-radius: 22px; padding: 16px; margin-bottom: 12px; position: relative; }
.stall h3 { margin: 0 0 2px; font-size: 18px; letter-spacing: -0.02em; }
.stall .sub { margin: 0 0 12px; color: var(--ink-2); font-size: 14px; }
.goods { display: flex; align-items: center; gap: 14px; }
.card { width: 78px; height: 106px; border-radius: 12px; display: grid; place-items: center; position: relative; font-weight: 900; color: #fff; box-shadow: 0 6px 14px rgba(0,0,0,.18); flex: none; }
.card .v { font-size: 40px; letter-spacing: -0.04em; line-height: 1; }
.card .k { position: absolute; top: 7px; left: 9px; font-size: 11px; font-weight: 800; opacity: .9; }
.card.unknown { background: repeating-linear-gradient(45deg, #2E3463 0 7px, #283059 7px 14px); border: 3px solid var(--ink); }
.card.seal { background: var(--cream); color: var(--ink); border: 3px dashed var(--ink); }
.card.seal.hidden { background: #E9E0CC; color: #A59C88; }
.card.small { width: 46px; height: 62px; border-radius: 8px; } .card.small .v { font-size: 22px; } .card.small .k { display: none; }
.plus { font-size: 26px; font-weight: 900; color: var(--ink-2); }
.pricebox { margin-left: auto; text-align: center; }
.price { min-width: 98px; padding: 8px 14px 10px; border-radius: 16px 16px 16px 4px; background: var(--lamp); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
.price small { display: block; font-size: 12px; font-weight: 800; }
.price b { display: block; font-size: 46px; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.price.tick b { animation: tick .25s ease; }
@keyframes tick { from { transform: scale(1.18); } }
.startlbl { font-size: 12px; color: var(--ink-2); margin-top: 8px; font-weight: 700; }
.slap { width: 100%; min-height: 72px; margin-top: 14px; border-radius: 18px; border: 3px solid var(--ink); background: var(--red); color: #fff; font-size: 24px; font-weight: 900; letter-spacing: -0.02em; box-shadow: 0 6px 0 var(--ink); }
.slap.keep { background: var(--ink); color: var(--lamp); }
.slap:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.slap:disabled { opacity: .4; }
.nums { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.nums button { height: 46px; border-radius: 10px; border: 2px solid var(--ink); background: #fff; font-weight: 900; font-size: 17px; color: var(--ink); }
.result { font-size: 15px; } .result b { font-size: 18px; }
.timer { height: 4px; border-radius: 4px; background: #EFE6D2; overflow: hidden; margin-top: 12px; }
.timer i { display: block; height: 100%; background: var(--ink); transform-origin: left; }

.ppl { display: grid; gap: 8px; }
.pp { background: rgba(255,255,255,.07); border-radius: 16px; padding: 10px 12px; }
.pp.sell { box-shadow: inset 0 0 0 2px var(--lamp); }
.pp .hd { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.pp .hd b { font-size: 15px; }
.pp .hd .sc { margin-left: auto; font-weight: 900; color: var(--lamp); }
.pp .hd .coin { opacity: .8; font-size: 13px; }
.pp .col { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.pp .col .card.small { box-shadow: none; }
.pp .empty { font-size: 12px; opacity: .6; margin-top: 6px; }
.help { font-size: 13px; opacity: .75; margin: 12px 2px 0; }
.toast { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); background: var(--ink); color: var(--cream); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 40; box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: calc(100% - 32px); text-align: center; }
.winner { text-align: center; } .winner b { font-size: 30px; display: block; letter-spacing: -0.03em; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
