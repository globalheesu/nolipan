<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>깜깜이 시장 · 놀이판</title>
<meta name="description" content="내 물건 값만 나만 몰라요. 친구들이 언제 사는지 보고 값을 짐작하세요. 떨어지는 가격, 먼저 치는 사람이 임자.">
<meta property="og:title" content="깜깜이 시장 · 놀이판">
<meta property="og:description" content="내 물건 값만 나만 몰라요. 떨어지는 가격, 먼저 치는 사람이 임자.">
<meta property="og:image" content="../assets/og-market.png">
<meta name="theme-color" content="#ECEDE8">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../shared/ui.css?v=20261126d">
<style>
/* 깜깜이 시장 — a dusk market. The falling price is the one loud object. */
:root { --table: #232845; --table-2: #2C3256; --accent: #E8B43A; --c0: #E0663F; --c1: #3D74D9; --c2: #2E9A62; --c3: #9058C9; }
body.on-table { background: var(--table) radial-gradient(120% 60% at 50% 0%, var(--table-2), var(--table) 70%); }
.round { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: var(--table-mute); margin: 0 2px 12px; }
.round .bar { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; } .round .bar i { display: block; height: 100%; background: var(--accent); }
.stall { background: var(--surface); color: var(--ink); border-radius: var(--r-lg); padding: 20px 18px 18px; position: relative; }
.stall h3 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.03em; }
.stall .sub { margin: 4px 0 16px; color: var(--ink-2); font-size: 14px; }
.goods { display: flex; align-items: center; gap: 12px; }
.card { width: 76px; height: 104px; border-radius: 11px; display: grid; place-items: center; position: relative; font-weight: 800; color: #fff; flex: none; box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 6px 14px rgba(20,24,50,.14); }
.card .v { font-size: 40px; letter-spacing: -0.05em; line-height: 1; }
.card .k { position: absolute; top: 8px; left: 9px; font-size: 11px; font-weight: 700; opacity: .85; }
.card.unknown { background: #2C3256 repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 6px, transparent 6px 12px); color: rgba(255,255,255,.7); }
.card.seal { background: #F4EFE4; color: var(--ink); box-shadow: inset 0 0 0 1.5px #D7CDB8; }
.card.seal::after { content: ''; position: absolute; right: 9px; bottom: 9px; width: 12px; height: 12px; border-radius: 50%; background: #B5473A; }
.card.seal .k { color: var(--ink-3); opacity: 1; }
.card.seal.hidden { color: #B4AA96; }
.card.small { width: 34px; height: 46px; border-radius: 6px; box-shadow: none; } .card.small .v { font-size: 17px; } .card.small .k { display: none; }
.plus { font-size: 20px; font-weight: 600; color: var(--ink-3); }
.pricebox { margin-left: auto; text-align: center; }
.price { min-width: 96px; padding: 10px 14px 12px; border-radius: 16px; background: var(--accent); color: var(--ink); }
.price small { display: block; font-size: 12px; font-weight: 700; opacity: .75; }
.price b { display: block; font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -0.05em; }
.price.tick b { animation: tick .25s ease; }
@keyframes tick { from { transform: translateY(-6px); opacity: .4; } }
.startlbl { font-size: 12px; color: var(--ink-3); margin-top: 6px; font-weight: 600; }
.slap { width: 100%; height: 64px; margin-top: 16px; border-radius: 16px; border: 0; background: var(--c0); color: #fff; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; transition: transform .08s, filter .15s; touch-action: manipulation; }
.slap.keep { background: var(--ink); color: #fff; }
.slap:active:not(:disabled) { transform: scale(.98); filter: brightness(.95); }
.slap:disabled { opacity: .35; }
.nums { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 16px; }
.nums button { height: 46px; border-radius: 10px; border: 0; background: var(--fill); font-weight: 700; font-size: 17px; color: var(--ink); }
.nums button:active { background: var(--ink); color: #fff; }
.timer { height: 3px; border-radius: 2px; background: var(--fill); overflow: hidden; margin-top: 16px; }
.timer i { display: block; height: 100%; background: var(--ink); transform-origin: left; }
.ppl { display: grid; gap: 8px; margin-top: 12px; }
.pp { background: rgba(255,255,255,.05); border-radius: var(--r-md); padding: 12px 14px; box-shadow: inset 0 0 0 1px var(--table-line); }
.pp.sell { box-shadow: inset 0 0 0 1.5px rgba(232,180,58,.6); }
.pp .hd { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.pp .hd b { font-size: 15px; font-weight: 700; }
.pp .selling { font-size: 11px; font-weight: 700; color: var(--accent); }
.pp .hd .coin { margin-left: auto; color: var(--table-mute); font-size: 13px; }
.pp .hd .sc { font-weight: 800; min-width: 3.2em; text-align: right; }
.pp .col { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.pp .empty { font-size: 13px; color: var(--table-mute); margin: 8px 0 0; }
.help { font-size: 13px; color: var(--table-mute); margin: 14px 2px 0; }
@media (max-width: 370px) { .card { width: 64px; height: 90px; } .card .v { font-size: 34px; } .price { min-width: 80px; } .price b { font-size: 38px; } }
</style>
</head>

</body>
</html>
