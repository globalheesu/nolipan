<meta property="og:title" content="꿈 사세요 · 놀이판">

<style>
/* A night dream-bazaar drawn like a minhwa folding screen: ink-indigo sky, hanji paper goods,
   lantern amber for prices, cinnabar for seals. The dream marble is the hero object. */
:root {
  --sky: #121833; --sky-2: #1C2550; --sky-3: #273266;
  --hanji: #F3EAD7; --hanji-2: #E7DBC2; --ink: #1D1A16; --ink-2: #5C554A; --mute: #A9A2C4;
  --lantern: #F4B942; --cinnabar: #C8412F; --line: rgba(29,26,22,.14);
  --k0: #2F8C7A; --k1: #D46A86; --k2: #D9572F; --k3: #3E58B0;
  --serif: 'Gowun Batang', 'Nanum Myeongjo', 'AppleMyungjo', 'Noto Serif KR', serif;
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; overflow-x: hidden; overflow-x: clip; }
body { color: var(--hanji); font-family: var(--font); font-size: 16px; line-height: 1.5; word-break: keep-all; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  background: var(--sky) radial-gradient(120% 60% at 50% -10%, var(--sky-3), var(--sky) 70%) fixed; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image: radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 72% 9%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 88% 32%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 34% 41%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 58% 66%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 8% 78%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 92% 88%, #fff 50%, transparent 51%); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--lantern); outline-offset: 2px; }
.wrap { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
.serif { font-family: var(--serif); }

/* ---------- title ---------- */
.title-hero { text-align: center; padding: 18px 0 8px; }
.title-hero .moon { width: 92px; height: 92px; margin: 0 auto 10px; border-radius: 50%; background: radial-gradient(circle at 38% 36%, #FFF6DA, #F4D58A 55%, #D9A84A); box-shadow: 0 0 60px rgba(244,185,66,.45), 0 0 140px rgba(244,185,66,.18); }
.title-hero h1 { font-family: var(--serif); font-weight: 700; font-size: 54px; letter-spacing: -0.02em; margin: 0; line-height: 1.05; color: #FFF6E2; text-shadow: 0 2px 30px rgba(244,185,66,.25); }
.title-hero .sub { font-family: var(--serif); color: var(--lantern); margin: 8px 0 0; font-size: 16px; }
.title-hero .lede { color: #D9D3EE; margin: 14px auto 0; max-width: 30em; font-size: 15px; }
.marbles { display: flex; justify-content: center; gap: 14px; margin: 22px 0 18px; }
.marbles .mb { width: 58px; height: 58px; }
.sheet { background: var(--hanji); color: var(--ink); border-radius: 22px; padding: 22px 20px 24px; box-shadow: 0 24px 60px rgba(0,0,0,.35); position: relative; }
.sheet h2 { font-family: var(--serif); font-size: 22px; margin: 0 0 12px; }
.field { margin-bottom: 12px; } .field label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
input[type=text] { width: 100%; min-width: 0; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: #FFFDF8; color: var(--ink); }
.row { display: flex; gap: 8px; } .row > * { flex: 1 1 0; min-width: 0; }
.btn { min-height: 52px; border-radius: 14px; border: 2px solid var(--ink); background: #FFFDF8; color: var(--ink); font-weight: 800; padding: 0 16px; }
.btn-primary { background: var(--ink); color: var(--hanji); }
.btn-lantern { background: var(--lantern); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-text { background: none; border: 0; color: var(--ink-2); font-weight: 700; padding: 10px 0; }
.msg { color: var(--cinnabar); font-size: 14px; min-height: 20px; margin: 4px 0 0; }
.fine { color: var(--ink-2); font-size: 13px; margin: 8px 0 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1 1 0; min-width: 0; min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: #FFFDF8; color: var(--ink); font-weight: 800; }
.seg button.on { border-color: var(--ink); background: var(--ink); color: var(--hanji); }
.rules { margin: 0 0 6px; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: r; }
.rules li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 15px; }
.rules li::before { counter-increment: r; content: counter(r); width: 28px; height: 28px; border-radius: 50%; background: var(--cinnabar); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; font-family: var(--serif); }
.rules b { display: block; font-family: var(--serif); font-size: 16px; } .rules span { color: var(--ink-2); }
details.howto { margin: 4px 0 16px; } details.howto summary { cursor: pointer; font-weight: 800; padding: 6px 0; list-style: none; } details.howto summary::-webkit-details-marker { display: none; }
details.howto summary::after { content: ' ▾'; color: var(--ink-2); } details.howto[open] summary::after { content: ' ▴'; }
.roomcode { display: flex; align-items: baseline; gap: 10px; } .roomcode b { font-size: 48px; font-weight: 900; letter-spacing: .06em; font-family: var(--serif); }
.players { display: grid; gap: 8px; margin: 10px 0 16px; } .players .p { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.pill { font-size: 11px; background: var(--hanji-2); border-radius: 999px; padding: 2px 8px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--ink); background: #fff; font-weight: 900; }

/* ---------- table ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; white-space: nowrap; }
.top .brand { margin: 0; color: var(--hanji); }
.iconbtn { background: rgba(255,255,255,.1); border: 0; border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 700; }
.actbar { display: flex; align-items: center; gap: 10px; margin: 2px 0 12px; }
.actbar .act { font-family: var(--serif); font-size: 18px; color: #FFF3D6; }
.actbar .prog { flex: 1; height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; }
.actbar .prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--lantern), #FFE3A0); }
.actbar .cnt { font-size: 12px; color: var(--mute); }
.tip { background: rgba(244,185,66,.12); border: 1px solid rgba(244,185,66,.45); border-radius: 14px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; color: #F6EED9; }
.tip b { color: var(--lantern); }

.stall { background: var(--hanji); color: var(--ink); border-radius: 24px; padding: 18px 16px 16px; margin-bottom: 14px; position: relative; box-shadow: 0 18px 50px rgba(0,0,0,.35);
  background-image: radial-gradient(rgba(120,90,40,.06) 1px, transparent 1px); background-size: 6px 6px; }
.stall h3 { font-family: var(--serif); margin: 0 0 2px; font-size: 20px; }
.stall .sub { margin: 0 0 14px; color: var(--ink-2); font-size: 14px; }
.goods { display: flex; align-items: center; gap: 12px; }
.plus { font-family: var(--serif); font-size: 26px; color: var(--ink-2); }

.dcard { width: 108px; height: 150px; border-radius: 14px; background: #FFFBF1; border: 2px solid var(--ink); position: relative; flex: none; box-shadow: 4px 5px 0 rgba(29,26,22,.85); display: grid; place-items: center; overflow: hidden; }
.dcard .kn { position: absolute; top: 7px; left: 9px; font-family: var(--serif); font-weight: 700; font-size: 13px; }
.dcard .vv { position: absolute; bottom: 4px; right: 9px; font-family: var(--serif); font-weight: 700; font-size: 34px; line-height: 1; }
.dcard .orb { width: 74px; height: 74px; margin-top: -8px; }
.dcard.unknown { background: linear-gradient(160deg, #2A3570, #151B3B); border-color: #0B0F22; color: #E9E3FF; }
.dcard.unknown .orb { opacity: .9; } .dcard.unknown .q { position: absolute; font-family: var(--serif); font-size: 40px; color: #FFF3D0; text-shadow: 0 0 18px rgba(255,220,140,.6); }
.dcard.small { width: 52px; height: 72px; border-radius: 9px; box-shadow: 2px 3px 0 rgba(29,26,22,.85); } .dcard.small .orb { width: 34px; height: 34px; margin-top: -10px; } .dcard.small .kn { display: none; } .dcard.small .vv { font-size: 18px; bottom: 3px; right: 6px; }
.slip { width: 62px; height: 150px; border-radius: 6px; background: #FFF8E6; border: 2px solid var(--ink); position: relative; flex: none; display: flex; flex-direction: column; align-items: center; padding: 10px 0; box-shadow: 3px 4px 0 rgba(29,26,22,.8); }
.slip .lb { writing-mode: vertical-rl; font-family: var(--serif); font-weight: 700; letter-spacing: .3em; font-size: 14px; color: var(--ink-2); }
.slip .vv { margin-top: auto; font-family: var(--serif); font-weight: 700; font-size: 32px; line-height: 1; }
.slip .stamp { position: absolute; bottom: 44px; right: -8px; width: 34px; height: 34px; border-radius: 6px; background: var(--cinnabar); color: #fff; display: grid; place-items: center; font-family: var(--serif); font-weight: 700; font-size: 18px; transform: rotate(-12deg); box-shadow: 0 0 0 2px #FFF8E6; }
.slip.hidden { background: repeating-linear-gradient(0deg, #E7DBC2 0 10px, #E0D2B4 10px 11px); }
.slip.hidden .vv { color: #9C9078; }
.slip.hidden::after { content: ''; position: absolute; top: 50%; left: -4px; right: -4px; height: 12px; margin-top: -6px; background: var(--cinnabar); border-radius: 3px; opacity: .9; }
.slip.small { width: 30px; height: 72px; padding: 4px 0; } .slip.small .lb { display: none; } .slip.small .vv { font-size: 16px; }

.lantern { margin-left: auto; text-align: center; flex: none; }
.lantern .body { position: relative; width: 96px; padding: 14px 8px 12px; border-radius: 40px 40px 34px 34px; background: radial-gradient(circle at 50% 40%, #FFE9A8, var(--lantern) 60%, #D98E1E); border: 3px solid var(--ink); box-shadow: 0 0 40px rgba(244,185,66,.55); }
.lantern .body::before, .lantern .body::after { content: ''; position: absolute; left: 22px; right: 22px; height: 8px; background: var(--ink); border-radius: 3px; }
.lantern .body::before { top: -8px; } .lantern .body::after { bottom: -8px; }
.lantern small { display: block; font-size: 12px; font-weight: 800; }
.lantern b { display: block; font-family: var(--serif); font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
.lantern.tick b { animation: tick .25s ease; } @keyframes tick { from { transform: scale(1.2); } }
.lantern .st { font-size: 12px; color: var(--ink-2); margin-top: 12px; font-weight: 700; }
.slap { width: 100%; min-height: 74px; margin-top: 16px; border-radius: 20px; border: 3px solid var(--ink); background: var(--cinnabar); color: #fff; font-size: 24px; font-weight: 900; box-shadow: 0 6px 0 var(--ink); font-family: var(--serif); letter-spacing: -0.01em; }
.slap.keep { background: var(--ink); color: var(--lantern); }
.slap:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); } .slap:disabled { opacity: .4; }
.nums { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
.nums button { height: 46px; border-radius: 10px; border: 2px solid var(--ink); background: #FFFDF8; font-weight: 900; font-size: 17px; color: var(--ink); font-family: var(--serif); }
.timer { height: 4px; border-radius: 4px; background: var(--hanji-2); overflow: hidden; margin-top: 14px; } .timer i { display: block; height: 100%; background: var(--ink); transform-origin: left; }

.panel { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); border-radius: 20px; padding: 14px; margin-bottom: 12px; }
.panel h4 { margin: 0 0 10px; font-family: var(--serif); font-size: 17px; display: flex; align-items: baseline; gap: 8px; }
.panel h4 .r { margin-left: auto; font-family: var(--font); font-size: 13px; color: var(--mute); font-weight: 600; }
.coins { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; color: #FFE7A6; }
.coin { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFE7A6, #C99630); position: relative; box-shadow: inset 0 0 0 2px #A87A1E; }
.coin::after { content: ''; position: absolute; inset: 5px; background: #2A2232; border-radius: 1px; }
.shelf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.shelf .k { background: rgba(255,255,255,.05); border-radius: 14px; padding: 8px 6px 10px; text-align: center; }
.shelf .k .mb { width: 34px; height: 34px; margin: 0 auto 4px; display: block; }
.shelf .k b { display: block; font-family: var(--serif); font-size: 13px; }
.shelf .k span { font-size: 12px; color: var(--mute); }
.orders { display: grid; gap: 8px; margin-top: 12px; }
.order { background: var(--hanji); color: var(--ink); border-radius: 14px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; position: relative; }
.order::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--cinnabar); }
.order .who { font-family: var(--serif); font-weight: 700; font-size: 15px; }
.order .need { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.order .pts { grid-row: span 2; font-family: var(--serif); font-weight: 700; font-size: 22px; color: var(--cinnabar); text-align: right; }
.order .pts small { display: block; font-family: var(--font); font-size: 11px; color: var(--ink-2); font-weight: 700; }
.order.done { background: #E6F2E7; } .order.done .pts { color: #1F7A3A; }
.pip { display: inline-flex; gap: 3px; } .pip i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; } .pip i.on { background: currentColor; }
.rivals { display: grid; gap: 8px; }
.rv { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; background: rgba(255,255,255,.05); border-radius: 14px; padding: 10px 12px; }
.rv.sell { box-shadow: inset 0 0 0 2px var(--lantern); }
.rv .nm { font-weight: 800; display: flex; gap: 6px; align-items: center; }
.rv .sc { font-family: var(--serif); font-weight: 700; color: var(--lantern); font-size: 18px; text-align: right; }
.rv .sc small { display: block; font-family: var(--font); font-size: 11px; color: var(--mute); font-weight: 600; }
.rv .ks { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: #E4DEF7; }
.rv .ks span { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.07); border-radius: 999px; padding: 2px 8px 2px 4px; }
.rv .ks .dot { width: 12px; height: 12px; border-radius: 50%; }
.help { font-size: 12px; color: var(--mute); margin: 10px 2px 0; }

/* act interstitial */
.curtain { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; text-align: center; background: radial-gradient(120% 80% at 50% 40%, rgba(39,50,102,.97), rgba(10,13,30,.98)); animation: curtain 3.2s ease forwards; pointer-events: none; padding: 24px; }
.curtain .n { font-family: var(--serif); color: var(--lantern); font-size: 16px; letter-spacing: .3em; }
.curtain h2 { font-family: var(--serif); font-size: 48px; margin: 6px 0 8px; color: #FFF6E2; }
.curtain p { color: #CFC8EA; margin: 0; font-size: 15px; max-width: 22em; }
@keyframes curtain { 0% { opacity: 0; } 12% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
.flash { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; pointer-events: none; }
.flash div { background: var(--hanji); color: var(--ink); border-radius: 22px; padding: 18px 26px; font-family: var(--serif); font-size: 22px; font-weight: 700; box-shadow: 0 20px 50px rgba(0,0,0,.4); text-align: center; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
.flash div small { display: block; font-family: var(--font); font-size: 14px; font-weight: 600; color: var(--ink-2); margin-top: 4px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }

/* finale */
.finale h2 { font-family: var(--serif); font-size: 30px; margin: 0 0 4px; text-align: center; }
.finale .lead { text-align: center; color: var(--ink-2); margin: 0 0 16px; }
.rank { border-top: 1px solid var(--line); padding: 14px 0; opacity: 0; animation: rise .5s ease forwards; }
.rank:first-of-type { border-top: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.rank .hd { display: flex; align-items: baseline; gap: 10px; }
.rank .pl { font-family: var(--serif); font-weight: 700; font-size: 22px; width: 28px; color: var(--ink-2); }
.rank.first .pl { color: var(--cinnabar); }
.rank .who { font-weight: 800; font-size: 17px; }
.rank .tot { margin-left: auto; font-family: var(--serif); font-weight: 700; font-size: 26px; }
.rank .bd { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--ink-2); margin: 6px 0 0 38px; }
.rank .bd b { color: var(--ink); }
.rank .od { margin: 6px 0 0 38px; display: grid; gap: 4px; font-size: 13px; }
.rank .od span.ok { color: #1F7A3A; font-weight: 700; } .rank .od span.no { color: #9C9078; text-decoration: line-through; }

.modal { position: fixed; inset: 0; background: rgba(8,10,25,.65); display: grid; place-items: end center; z-index: 40; padding: 16px; overflow-y: auto; }
.modal .sheet { width: 100%; max-width: 540px; }
.toast { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); background: var(--ink); color: var(--hanji); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: calc(100% - 32px); text-align: center; }
@media (min-width: 720px) { .title-hero h1 { font-size: 68px; } .dcard { width: 124px; height: 172px; } .slip { height: 172px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .curtain { display: none; } .rank { opacity: 1; } }
</style>
