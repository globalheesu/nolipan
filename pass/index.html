<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>넘겨! · 놀이판</title>
<meta name="description" content="폰을 테이블에 맞대 붙이면 하나의 판이 돼요. 화면을 넘어 굴러다니는 폭탄을 튕겨 넘기세요. 2–8명.">
<meta property="og:title" content="넘겨! · 놀이판">
<meta property="og:description" content="폰을 맞대 붙이고, 화면을 넘어 굴러다니는 폭탄을 튕겨 넘기세요.">
<meta property="og:image" content="../assets/og-pass.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FFD23F">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../shared/brand.css">
<style>
/* Layout idea: every phone is one tile of a shared tabletop. Menus are a bold yellow card; in play the whole screen is the tile. */
:root {
  --sun: #FFD23F;       /* brand of this game: warning-tape yellow */
  --ink: #16151A;
  --ink-2: #4A4852;
  --paper: #FFFDF5;
  --red: #FF3B30;
  --font: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body { background: var(--sun); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; word-break: keep-all; -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
#menu { position: fixed; inset: 0; overflow-y: auto; padding: max(20px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom)); background: var(--sun); background-image: repeating-linear-gradient(-45deg, rgba(22,21,26,.06) 0 14px, transparent 14px 28px); }
#menu[hidden] { display: none; }
.sheet { width: min(480px, 100%); margin: 0 auto; background: var(--paper); border-radius: 22px; padding: 22px 20px 24px; box-shadow: 0 2px 0 var(--ink), 0 18px 40px rgba(22,21,26,.18); border: 2px solid var(--ink); }
.logo { font-weight: 900; font-size: clamp(64px, 20vw, 96px); letter-spacing: -0.06em; line-height: .95; margin: 6px 0 10px; display: flex; align-items: center; gap: 10px; }
.logo .bomb { width: .8em; height: .8em; flex: none; }
.tag { margin: 0 0 18px; font-size: 17px; color: var(--ink-2); letter-spacing: -0.01em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 20px; }
.chips span { font-size: 13px; font-weight: 700; background: var(--sun); border-radius: 999px; padding: 4px 10px; }
.demo { width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; background: #EDE7D3; margin: 4px 0 18px; overflow: hidden; }
.demo svg { width: 100%; height: 100%; display: block; }
h2 { font-size: 22px; letter-spacing: -0.03em; margin: 0 0 14px; font-weight: 800; }
.field { display: grid; gap: 8px; margin-bottom: 14px; }
.field label { font-weight: 700; font-size: 14px; }
input[type=text] { font-size: 16px; border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; min-height: 48px; background: #fff; width: 100%; -webkit-user-select: text; user-select: text; }
#code { max-width: 140px; letter-spacing: .25em; font-weight: 900; text-align: center; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 2px solid var(--ink); border-radius: 14px; min-height: 52px; padding: 0 20px; font-weight: 800; background: #fff; }
.btn-primary { background: var(--ink); color: var(--sun); }
.btn-primary:active, .btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .4; }
.btn-text { border: 0; background: none; font-weight: 700; color: var(--ink-2); min-height: 44px; padding: 0 4px; }
.divider { border: 0; border-top: 2px dashed rgba(22,21,26,.2); margin: 18px 0; }
.msg { color: #C21D14; font-size: 14px; margin: 6px 0 0; }
.msg:empty { display: none; }
.fine { font-size: 13px; color: var(--ink-2); margin: 8px 0 0; }
.roomcode { display: flex; align-items: baseline; gap: 10px; }
.roomcode b { font-size: 60px; font-weight: 900; letter-spacing: .05em; line-height: 1; font-variant-numeric: tabular-nums; }
.players { display: grid; gap: 8px; margin: 8px 0 16px; }
.p { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.dot { width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--ink); flex: none; }
.pill { font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: #EDE7D3; }
.steps { margin: 0 0 16px; padding-left: 20px; display: grid; gap: 6px; }
.howto { display: grid; gap: 10px; margin: 0 0 18px; padding: 0; list-style: none; counter-reset: s; }
.howto li { counter-increment: s; display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; }
.howto li::before { content: counter(s); width: 32px; height: 32px; border-radius: 10px; background: var(--ink); color: var(--sun); display: grid; place-items: center; font-weight: 900; }
.howto b { display: block; }
.howto span { color: var(--ink-2); font-size: 14px; }

/* play surface */
#stage { position: fixed; inset: 0; touch-action: none; display: none; }
#stage.on { display: block; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud { position: absolute; left: 0; right: 0; top: 0; padding: max(10px, env(safe-area-inset-top)) 14px 0; display: flex; align-items: center; gap: 10px; pointer-events: none; color: var(--ink); }
#hud .name { font-weight: 900; font-size: 18px; letter-spacing: -0.02em; }
#hud .hearts { margin-left: auto; font-size: 18px; letter-spacing: 2px; }
#banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(86%, 380px); text-align: center; pointer-events: none; }
#banner h3 { font-size: 28px; font-weight: 900; letter-spacing: -0.04em; margin: 0 0 6px; }
#banner p { margin: 0; font-size: 15px; color: var(--ink-2); }
#ctrl { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 14px max(14px, env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; }
#ctrl .btn { pointer-events: auto; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--sun); padding: 10px 16px; border-radius: 12px; z-index: 60; font-size: 14px; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="menu"></div>
<div id="stage"><canvas id="cv"></canvas><div id="hud"></div><div id="banner"></div><div id="ctrl"></div></div>
<script src="../vendor/peerjs.min.js"></script>
<script src="../shared/net.js"></script>
<script src="../shared/sfx.js"></script>
<script src="app.js"></script>
</body>
</html>
