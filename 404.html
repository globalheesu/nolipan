<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페이지를 찾을 수 없어요 · 놀이판</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/nolipan/assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --ink: #191F28; --ink-2: #4E5968; --bg: #F2F4F6; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif; padding: 24px; word-break: keep-all; }
  main { max-width: 420px; text-align: center; }
  .card { width: 96px; height: 132px; margin: 0 auto 24px; border-radius: 16px; background: #2F6B57; border: 4px solid #fff; box-shadow: 0 16px 32px rgba(25,31,40,.18); display: grid; place-items: center; color: #fff; font: italic 700 64px Georgia, serif; transform: rotate(-6deg); }
  h1 { font-size: 26px; letter-spacing: -0.03em; margin: 0 0 8px; }
  p { color: var(--ink-2); margin: 0 0 24px; line-height: 1.6; }
  a { display: inline-block; background: var(--ink); color: #fff; text-decoration: none; font-weight: 700; border-radius: 14px; padding: 14px 22px; }
  a:focus-visible { outline: 3px solid #3182F6; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="card" aria-hidden="true">x</div>
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었거나 잘못 입력됐어요. 초대 링크를 받았다면 홈에서 방 코드를 넣어도 들어갈 수 있어요.</p>
  <a href="/nolipan/">놀이판 홈으로</a>
</main>
</body>
</html>
