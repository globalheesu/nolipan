<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>속셈 · 놀이판</title>
<meta name="description" content="내 비밀 조건이 맞는 순간 종을 쳐요. 남의 속셈을 읽으면 그걸로 먼저 쳐서 점수를 뺏어요. 3–6명, 한 판 3분.">
<meta property="og:title" content="속셈 · 놀이판">
<meta property="og:description" content="내 조건이 맞으면 땡! 남의 속셈을 읽으면 가로채기. 한 판 3분.">
<meta property="og:image" content="../assets/og-sokssem.png">
<meta name="theme-color" content="#ECEDE8">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../shared/ui.css?v=20261126d">
<style>
/* 속셈 — a felt card table. Quiet chrome, the bell is the only loud object. */
:root { --table: #1E4A3E; --table-2: #23574A; --table-3: #163A30; --accent: #E2B04A;
  --c0: #D9453F; --c1: #D49A06; --c2: #23935A; --c3: #2F67D8; --c4: #8650BF; --good: #74D39C; }
body.on-table { background: var(--table) radial-gradient(120% 70% at 50% 35%, var(--table-2), var(--table) 60%, var(--table-3)); }

/* cards */
.card { --cc: var(--ink); position: relative; width: 74px; height: 104px; border-radius: 11px; background: #FBFAF6; color: var(--cc); box-shadow: 0 1px 0 rgba(0,0,0,.18), 0 8px 18px rgba(0,0,0,.18); display: grid; place-items: center; flex: none; }
.card .n { font-size: 46px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin-top: 4px; }
.card .sh { position: absolute; width: 13px; height: 13px; } .card .sh.a { top: 8px; left: 8px; } .card .sh.b { bottom: 8px; right: 8px; transform: rotate(180deg); }
.card.k0 { --cc: var(--c0); } .card.k1 { --cc: var(--c1); } .card.k2 { --cc: var(--c2); } .card.k3 { --cc: var(--c3); } .card.k4 { --cc: var(--c4); }
.card.new { animation: flip .36s var(--ease); }
.card.fresh { animation: deal .4s var(--ease) both; }
@keyframes flip { 0% { transform: rotateY(90deg); } 100% { transform: none; } }
@keyframes deal { 0% { transform: translateY(-24px); opacity: 0; } }
.card.mini { width: 20px; height: 28px; border-radius: 4px; box-shadow: none; }
.card.mini .n { font-size: 14px; margin-top: 1px; letter-spacing: -0.02em; } .card.mini .sh.a { width: 5px; height: 5px; top: 2px; left: 2px; } .card.mini .sh.b { display: none; }

/* opponents */
.pips { display: flex; gap: 3px; } .pips i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); } .pips i.on { background: var(--accent); }
.opps { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 8px; }
.opp { text-align: left; border: 0; box-shadow: inset 0 0 0 1px var(--table-line); background: rgba(0,0,0,.16); color: var(--table-ink); border-radius: 16px; padding: 10px 10px 11px; display: grid; gap: 8px; touch-action: manipulation; position: relative; min-width: 0; transition: box-shadow .15s, background .15s, transform .08s; }
.opp:not(:disabled):active { background: rgba(0,0,0,.28); transform: scale(.98); }
.opp:disabled { cursor: default; }
.opp .hd { display: flex; align-items: center; gap: 7px; min-width: 0; }
.opp .nm { flex: 1; font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opp .pt { font-size: 18px; font-weight: 800; line-height: 1; }
.clues { display: grid; gap: 4px; }
.clue { display: flex; gap: 3px; height: 28px; }
.clue.empty i { flex: none; width: 20px; height: 28px; border-radius: 4px; background: rgba(255,255,255,.05); }
.opp.ready { box-shadow: inset 0 0 0 1.5px rgba(226,176,74,.7); }
.opp.flash { box-shadow: inset 0 0 0 2px var(--good); background: rgba(116,211,156,.12); }
.opp.lost { box-shadow: inset 0 0 0 2px #FF8A85; background: rgba(217,69,63,.14); }

/* table */
.mat { margin: 14px 0 0; padding: 16px 10px 14px; border-radius: 22px; background: rgba(0,0,0,.14); box-shadow: inset 0 0 0 1px var(--table-line); }
.board { display: grid; grid-template-columns: repeat(4, auto); justify-content: center; gap: 8px; }
.slot { width: 74px; height: 104px; border-radius: 11px; background: rgba(255,255,255,.04); position: relative; }
.slot .card { position: absolute; inset: 0; width: auto; height: auto; }
.slot.next::after { content: ''; position: absolute; left: 50%; bottom: -9px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
.board.hit .card { box-shadow: 0 0 0 2.5px var(--good), 0 8px 18px rgba(0,0,0,.2); }
.board.miss .card { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.bellrow { position: relative; display: grid; place-items: center; margin-top: 8px; }
.bell { display: block; width: 150px; height: 150px; border: 0; padding: 0; background: none; position: relative; touch-action: manipulation; }
.bell svg { width: 100%; height: 100%; display: block; transition: transform .06s; }
.bell:not(:disabled):active svg { transform: translateY(5px) scale(.97); }
.bell:disabled { cursor: default; } .bell:disabled svg { filter: saturate(.25) brightness(.8); }
.ring { position: absolute; left: 50%; top: 50%; width: 140px; height: 140px; margin: -76px 0 0 -70px; border-radius: 50%; border: 3px solid var(--accent); opacity: 0; pointer-events: none; }
.ring.go { animation: ring .55s ease-out; }
@keyframes ring { 0% { opacity: .9; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.5); } }
.status { text-align: center; min-height: 22px; margin: 0 0 10px; font-weight: 600; color: var(--table-mute); font-size: 14px; }
.status b { color: var(--table-ink); }
.mine { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 2px 12px; background: var(--surface); color: var(--ink); border-radius: 18px; padding: 14px 16px 16px; }
.mine small { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.mine .c { grid-column: 1; font-size: 20px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3; }
.mine .sc { grid-column: 2; grid-row: 1 / span 2; text-align: right; line-height: 1; } .mine .sc b { font-size: 34px; font-weight: 800; letter-spacing: -0.04em; } .mine .sc span { font-size: 14px; font-weight: 600; color: var(--ink-3); }
.mine .pips { grid-column: 1 / -1; margin-top: 10px; } .mine .pips i { background: var(--fill-2); } .mine .pips i.on { background: var(--table); }
.chip { display: inline-flex; align-items: center; gap: 5px; } .chip svg { width: 16px; height: 16px; }

/* moments */
.pop { position: fixed; left: 50%; top: 58%; transform: translate(-50%, -50%); z-index: 30; pointer-events: none; text-align: center; animation: pop 1.6s ease both; width: min(92vw, 420px); }
.pop .big { font-size: 64px; font-weight: 900; letter-spacing: -0.05em; line-height: 1; color: #fff; text-shadow: 0 6px 24px rgba(0,0,0,.35); }
.pop .big.bad { color: #FFB1AD; } .pop .big.steal { color: var(--good); }
.pop .line { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 16px 6px 6px; font-weight: 700; font-size: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.pop .reveal { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: #fff; border-radius: 12px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.pop.long { animation-duration: 2.6s; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -44%) scale(.85); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
.count { position: fixed; inset: 0; display: grid; place-items: center; z-index: 25; pointer-events: none; font-size: 112px; font-weight: 800; letter-spacing: -0.05em; color: #fff; }
.count span { animation: cnt .9s ease both; }
@keyframes cnt { 0% { transform: scale(1.4); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 100% { opacity: .0; } }

/* result conditions */
.standings .who .conds { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.standings .who .conds span { display: inline-flex; margin: 0; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 8px; background: var(--fill); color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; }
.standings .who .conds span svg { width: 10px; height: 10px; }
.standings .who .conds span.gone { text-decoration: line-through; color: var(--ink-3); background: none; box-shadow: inset 0 0 0 1px var(--line); }

@media (max-width: 370px) { .card, .slot { width: 64px; height: 92px; } .card .n { font-size: 40px; } .bell { width: 130px; height: 130px; } }
@media (min-width: 720px) { .card, .slot { width: 92px; height: 128px; } .card .n { font-size: 58px; } .card.mini { width: 24px; height: 34px; } .card.mini .n { font-size: 17px; } .clue { height: 34px; } .clue.empty i { width: 24px; height: 34px; } }
</style>
</head>
